<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Plan">
<meta name="theme-color" content="#f6f2ea">
<link rel="apple-touch-icon" href="life-plan-icon.png?v=2">
<link rel="icon" type="image/png" href="life-plan-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: cream page, each block sits in its own white card; fixed header + fixed bottom tabs, only the middle scrolls; create/edit opens as a full-screen sheet */
:root{
  --bg:#f6f2ea; --card:#ffffff; --surface:#f1ece2; --line:#e9e2d5; --fg:#1f1c17; --sub:#6b665b;
  --accent:#2f6a50; --accent-soft:#e6f0ea; --ok:#2f6a50; --ng:#c0432f;
  --c-charge:#7a62c4; --c-want:#c48a14;
  --font-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --font-num:"Manrope",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --r:18px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{flex:none;padding-block:16px 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.01em}
.hleft{display:flex;align-items:center;gap:10px;min-width:0}
#hlact{display:flex;gap:8px}
.gear{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.gear svg{width:20px;height:20px;stroke:var(--fg);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left}
.srow .n{font-weight:700}.srow .s{font-size:12.5px;color:var(--sub)}
.brand{font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--sub)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:6px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:4px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;font-size:10.5px;color:var(--sub)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 8px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(60,48,20,.12)}

/* cards */
.sec,.need,.sum,.goal,.main>.list,.main>.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(60,48,20,.04)}
.sec{display:flex;flex-direction:column;padding:14px 16px 4px}
.main>.list{padding:0 16px}
h2{margin:0 0 4px;font-size:16px;font-weight:700}
.need{display:flex;flex-direction:column;gap:2px;padding:18px 18px 16px}
.need .label,.sum .label{font-size:14px;color:var(--sub)}
.need .big{font-size:42px;font-weight:800;line-height:1.1}
.need .big small{font-size:22px;font-weight:700;margin-right:2px}
.sum{display:flex;flex-direction:column;gap:2px;padding:16px 18px}
.sum .big{font-size:32px;font-weight:800;line-height:1.15}
.sum .big small{font-size:19px;margin-right:2px}
.sum .meta{font-size:13px;color:var(--sub)}

/* bank rows */
.bk{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
button.bk{width:100%;text-align:left}
.bk .a .num{font-family:var(--font-num)}
.bk .a .s{font-weight:400;margin-top:2px}
.ev.past .t div:first-child,.ev.past .r .num{color:var(--sub);font-weight:500}
.bk .n{font-weight:700;overflow-wrap:anywhere}
.bk .s{font-size:12.5px;color:var(--sub)}
.bk .a{grid-row:1/span 3;grid-column:2;text-align:right;font-weight:700;font-size:17px}
.bk.unset .n{color:var(--ng)}

.goal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:16px 18px;text-align:left;width:100%}
.goal .k{font-size:13px;color:var(--sub)}
.goal .v{font-size:20px;font-weight:700}
.goal .res{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.goal .res b{font-size:20px}
.ok{color:var(--ok)} .ng{color:var(--ng)}
.chev{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.ev{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border-radius:12px;height:48px}
.date .d{font-family:var(--font-num);font-weight:700;font-size:16px;line-height:1.1}
.date .w{font-size:10.5px;color:var(--sub)}
.ev .t{min-width:0}
.ev .t div:first-child{font-weight:700;overflow-wrap:anywhere}
.ev .t div:last-child{font-size:12.5px;color:var(--sub)}
.ev .r{text-align:right}
.ev .r .num{font-weight:700}
.ev .r div:last-child{font-size:12px;color:var(--sub)}
.ev .r .soon{color:var(--ng)}
.ev.charge .t div:first-child,.ev.charge .r .num{color:var(--sub);font-weight:500}
.mk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mk.withdraw{background:var(--accent)} .mk.charge{background:var(--c-charge)} .mk.want{background:var(--c-want)} .mk.adjust{background:var(--ng)} .mk.save{background:var(--c-want)}
.empty{padding:20px 8px 24px;text-align:center;color:var(--sub);font-size:14px}

/* calendar */
.mnav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.mnav h2{text-align:center;margin:0;font-size:18px}
.mnav button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.mnav svg{width:20px;height:20px;stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.main>.cal{padding:12px 8px 8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--sub);padding-bottom:2px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;padding-bottom:4px;padding-top:5px;border-radius:12px;min-width:0}
.cell .dn{font-family:var(--font-num);font-weight:600;font-size:14px;width:26px;height:22px;display:grid;place-items:center;border-radius:11px}
.cell .am{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:10.5px;font-weight:700;line-height:1.2;max-width:100%;overflow:hidden;white-space:nowrap}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dots i{width:5px;height:5px;border-radius:50%}
.cell .dots .charge{background:var(--c-charge)} .cell .dots .want{background:var(--c-want)} .cell .dots .adjust{background:var(--ng)}
.cell.today .dn{background:var(--fg);color:var(--card)}
.cell[aria-pressed="true"]{background:var(--accent-soft)}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--sub);padding:0 4px}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row>div{min-width:0}
.row .n{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.row .a{text-align:right}
.row .a .num{font-weight:700;font-size:16px}
.row .a div:last-child{font-size:12px;color:var(--sub)}
.row.done .n,.row.done .a .num{color:var(--sub);text-decoration:line-through}
.row.off .n,.row.off .a .num{color:var(--sub)}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface);color:var(--fg);font-weight:600}
.tag.card{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:transparent;border:1px solid var(--ng);color:var(--ng)}
.prog{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--c-want)}
.subh{font-size:13px;color:var(--sub);font-weight:700}
.sec>.subh{margin-bottom:2px}
.subhr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.subhr h2{margin:0}
.subhr button{color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.mv{display:flex;gap:6px}
.mv button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.mv button:disabled{opacity:.3;cursor:default}
.mv svg{width:18px;height:18px;stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bk .bal{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:13.5px}
.banner button{color:var(--accent);font-weight:700;white-space:nowrap}

.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(47,106,80,.35);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab[hidden]{display:none}
.fab svg{width:24px;height:24px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}

/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;transform:translateY(100%);transition:transform .24s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .hd{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.sheet .hd h3{margin:0;text-align:center;font-size:16px}
.sheet .hd .x{justify-self:start;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.sheet .hd .x svg{width:20px;height:20px;stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round}
.sheet .hd .save{justify-self:end;color:var(--accent);font-weight:700;padding:6px 8px}
.sheet .bd{flex:1;overflow-y:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lb{font-size:13px;color:var(--sub);font-weight:700}
.inp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);min-height:50px}
.inp:focus-within{border-color:var(--accent)}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--fg);padding:12px 0;outline:none;appearance:none;-webkit-appearance:none}
.inp input::placeholder{color:var(--sub);opacity:.75}
.inp .pre,.inp .suf{color:var(--sub);font-size:15px;white-space:nowrap}
.err{font-size:12.5px;color:var(--ng)}
.hint{font-size:12.5px;color:var(--sub)}
.sheet .seg{background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.chips .none{color:var(--sub);font-size:13.5px;padding:4px 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);width:100%;text-align:left}
.sw .tx div:first-child{font-weight:700}
.sw .tx div:last-child{font-size:12.5px;color:var(--sub)}
.knob{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .18s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw[aria-checked="true"] .knob{background:var(--accent)}
.sw[aria-checked="true"] .knob::after{transform:translateX(18px)}
.ta{width:100%;box-sizing:border-box;min-height:220px;border:1px solid var(--line);border-radius:14px;padding:12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);color:var(--fg);resize:vertical}
.calc{font-size:13.5px;color:var(--sub);padding:12px 14px;background:var(--surface);border-radius:14px}
.calc b{color:var(--fg)}
.del{margin-top:8px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ng);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(30,24,12,.4);display:grid;place-items:center;z-index:30;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.dlg{background:var(--card);border-radius:20px;padding:22px 20px 16px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:6px;text-align:center}
.dlg h4{margin:0;font-size:16px}
.dlg p{margin:0 0 10px;font-size:13.5px;color:var(--sub)}
.dlg .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .btns button{padding:12px;border-radius:12px;background:var(--surface);font-weight:700}
.dlg .btns .danger{background:var(--ng);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:40;white-space:nowrap}

/* life */
#hact{display:flex;gap:8px}
.hbtn{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:700;font-size:13px}
.dateline{font-size:14px;color:var(--sub);font-weight:600;padding:0 4px}
.dnav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:6px}
.dnav .dl{display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.3}
.dnav .dl b{font-size:16px}
.dpill{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1;border:1px solid var(--line);background:var(--card);color:var(--accent);box-sizing:border-box}
.dpill.on{background:var(--accent-soft);border-color:transparent}
.nb{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.nb svg{width:18px;height:18px;stroke:var(--fg);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pbtn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;text-align:center;margin:4px 0 12px}
.pbtn.sub{background:var(--card);color:var(--accent);border:1px solid var(--line);margin:0}
.need .pbtn.sub{margin-top:8px}
.mline{display:flex;flex-wrap:wrap;gap:6px}
.tl{position:relative;margin-left:42px;margin-right:2px}
.hline{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.hl{position:absolute;left:-42px;width:36px;text-align:right;font-size:10.5px;color:var(--sub)}
.blk{position:absolute;left:0;right:0;border-radius:10px;padding:3px 10px;box-sizing:border-box;overflow:hidden;font-size:12.5px;line-height:1.35;cursor:pointer}
.blk.one{white-space:nowrap;display:flex;align-items:center;gap:6px;line-height:1.2;padding-top:0;padding-bottom:0;font-size:12.5px}
.blk.one b{overflow:hidden;text-overflow:clip;min-width:0}
.blk.one .tm{flex:none}
.blk.xs{font-size:11px}
.blk .tm{color:inherit;opacity:.8;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.k-tpl{background:var(--card);border:1px solid var(--line)}
.k-event{background:var(--accent-soft);color:#24523e}
.k-todo{background:#f8eccf;border:1.5px solid #c48a14;color:#5e4005}
.blk.done{opacity:.55}.blk.done b{text-decoration:line-through}
.hdl{position:absolute;left:50%;bottom:0;width:56px;height:16px;margin-left:-28px;cursor:ns-resize;touch-action:none}
.hdl::after{content:"";position:absolute;left:16px;right:16px;bottom:3px;height:4px;border-radius:2px;background:currentColor;opacity:.35}
.gap{position:absolute;left:0;right:0;border:1.5px dashed #cfc7b8;border-radius:10px;background:transparent;color:var(--sub);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;box-sizing:border-box}
.gap b{color:var(--accent)}.gap.sm{font-size:10.5px;border-width:1px}
.ev .date.tm .d{font-size:14px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.tbody .n{font-weight:700;overflow-wrap:anywhere}.tbody .n.off,.n.off{color:var(--sub);text-decoration:line-through}
.tbody .s,.subhr .s,.need .s,.mgroup .s,.tapcard .s{font-size:12.5px;color:var(--sub)}
.tbody .s{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tbody .bar{width:100%}
.ckb{flex:none;width:28px;height:28px;display:grid;place-items:center}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid #c9c1b2;box-sizing:border-box;display:block;flex:none}
.ckb[aria-pressed="true"] .ck,.ckb.on .ck,.ckrow[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.ckb[aria-pressed="true"] .ck::after,.ckb.on .ck::after,.ckrow[aria-pressed="true"] .ck::after{content:"";display:block;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(8px,3px) rotate(45deg)}
.ckrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);width:100%;text-align:left;margin-top:6px;box-sizing:border-box}
.ckrow.fixed{color:var(--sub)}
.ckrow .num{font-size:13px;font-weight:700}
.bar{display:block;height:7px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.tapcard{width:100%;text-align:left;display:flex;flex-direction:column}
.kbig{font-size:30px;font-weight:800;line-height:1.1}.kbig small{font-size:14px;color:var(--sub);font-weight:700}
.need .big small{font-weight:700}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fchips button{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px}
.fchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.mgroup{padding:8px 0;border-bottom:1px solid var(--line)}.mgroup:last-child{border-bottom:0}
.mhd{display:flex;align-items:center;gap:10px}.mhd b{flex:1}.mhd button{color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.mrow{display:flex;justify-content:space-between;width:100%;padding:6px 0;text-align:left;font-size:14px}
.mrow .num{font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>.f{min-width:0}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;margin-top:6px}
.pick[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.pick .s{font-size:12.5px;color:var(--sub)}
.seg button{white-space:nowrap}
@media (prefers-reduced-motion: reduce){.sheet,.knob,.knob::after,.fab{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="hleft"><h1 id="title">今日</h1><div id="hlact"></div></div><div id="hact"></div></header>
  <main class="main" id="main"></main>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div>
<button class="fab" id="fab" aria-label="追加" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="hd"><button class="x" id="sheetClose" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h3 id="sheetTitle"></h3><button class="save" id="sheetSave">保存</button></div>
  <form class="bd" id="sheetBody" novalidate></form>
</div>
<div id="layer"></div>

<script>
(function(){
const ICONS={
  today:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  plan:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  todo:'<path d="M10 7h10M10 12h10M10 17h10"/><path d="M4 7l1.2 1.2L7.5 6M4 12l1.2 1.2 2.3-2.2M4 17l1.2 1.2 2.3-2.2"/>',
  body:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  money:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/>'
};
const TABS=[["today","今日"],["plan","予定"],["todo","やること"],["body","体"],["money","お金"]];
const WD=["日","月","火","水","木","金","土"];
const LSKEY="money-plan-v2",LSV1="money-plan-v1";

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const toStr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{if(!s||typeof s!=="string")return null;const[y,m,d]=s.split("-").map(Number);if(!y||!m||!d)return null;return new Date(y,m-1,d)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const ymKey=(y,m)=>{const d=new Date(y,m,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
function addMonths(a,n){const y=a.getFullYear(),m=a.getMonth()+n,last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(a.getDate(),last))}
function monthRange(off){const t=today();return{start:new Date(t.getFullYear(),t.getMonth()+off,1),end:new Date(t.getFullYear(),t.getMonth()+off+1,0)}}
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const yen=n=>Math.round(n||0).toLocaleString("ja-JP");
const compact=n=>n>=10000?(Math.round(n/1000)/10)+"万":Math.round(n).toLocaleString("ja-JP");
const md=d=>(d.getMonth()+1)+"/"+d.getDate();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const sameDay=(a,b)=>a&&b&&a.getTime()===b.getTime();

/* ---------- state ---------- */
const empty=()=>({v:2,goal:0,accounts:[],items:[],bills:{},wants:[],migratedV1:false});
function normalize(s){
  const e=empty();if(!s||typeof s!=="object")return e;
  s=JSON.parse(JSON.stringify(s));
  return{v:2,goal:+s.goal||0,migratedV1:!!s.migratedV1,
    accounts:Array.isArray(s.accounts)?s.accounts:[],items:Array.isArray(s.items)?s.items:[],
    bills:s.bills&&typeof s.bills==="object"?s.bills:{},wants:Array.isArray(s.wants)?s.wants:[]};
}
const hasContent=s=>s.items.length||s.accounts.length||s.wants.length||s.goal;
let state=empty();
try{const raw=localStorage.getItem(LSKEY);if(raw)state=normalize(JSON.parse(raw))}catch(e){}
try{if(!state.migratedV1){const raw=localStorage.getItem(LSV1);if(raw){const m=fromV1(JSON.parse(raw));if(m)merge(m)}}}catch(e){}

function fromV1(o){
  if(!o||o.sample)return null;
  const out={items:[],accounts:[],bills:{},wants:Array.isArray(o.wants)?o.wants:[],goal:+o.goal||0};
  const subs=o.subs||[],fixed=o.fixed||[];let card=null;
  if(subs.some(s=>s.card)||fixed.some(f=>f.card)){card={id:uid(),name:"クレカ",type:"card",bankId:"",day:0};out.accounts.push(card)}
  subs.forEach(s=>out.items.push({id:s.id||uid(),name:s.name,amount:+s.amount||0,kind:"サブスク",cycle:s.cycle==="yearly"?"yearly":"monthly",every:1,date:s.date,payFrom:s.card&&card?card.id:"",endDate:"",active:true}));
  const t=today();
  fixed.forEach(f=>out.items.push({id:f.id||uid(),name:f.name,amount:+f.amount||0,kind:"固定費",cycle:"monthly",every:1,date:toStr(new Date(t.getFullYear(),t.getMonth(),Math.min(+f.day||1,28))),payFrom:f.card&&card?card.id:"",endDate:"",active:true}));
  (o.cards||[]).forEach(c=>{const d=parse(c.date);const a={id:uid(),name:c.name,type:"card",bankId:"",day:d?d.getDate():0};out.accounts.push(a);if(d)out.bills[a.id]={[ymKey(d.getFullYear(),d.getMonth())]:+c.amount||0}});
  return out;
}
function merge(m){
  state.items=state.items.concat(m.items);state.accounts=state.accounts.concat(m.accounts);
  state.wants=state.wants.concat(m.wants);Object.assign(state.bills,m.bills);
  if(!state.goal&&m.goal)state.goal=m.goal;state.migratedV1=true;
}

/* ---------- storage ---------- */
let docRef=null,writing=false,pending=false,timer=null;
function cache(){try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(e){}}
function persist(){cache();if(!docRef)return;clearTimeout(timer);timer=setTimeout(flush,500)}
async function flush(){
  if(!docRef)return;if(writing){pending=true;return}
  writing=true;
  try{await docRef.set(JSON.parse(JSON.stringify(state)))}
  catch(e){if(e&&e.code==="unavailable")setTimeout(flush,800+Math.random()*800);else toast("保存できませんでした。この端末にだけ残っています")}
  writing=false;if(pending){pending=false;flush()}
}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  let db,user;
  try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){return}
  if(!db)return;
  docRef=db.doc("plan/main");
  let first=true;
  docRef.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){
      const incoming=normalize(snap.data());
      if(JSON.stringify(incoming)!==JSON.stringify(state)){state=incoming;cache();rerender()}
    }else if(!snap.metadata.fromCache&&hasContent(state))flush();
    if(first&&!snap.metadata.fromCache){first=false;if(!state.migratedV1)migrateDbV1(db,user)}
  },()=>{docRef=null});
}
async function migrateDbV1(db,user){
  try{const id=user&&await user.id();if(id){const s=await db.doc("data/users/"+id+"/app").get();if(s.exists){const m=fromV1(s.data());if(m)merge(m)}}}catch(e){}
  state.migratedV1=true;persist();rerender();
}

/* ---------- calc ---------- */
const CASH={id:"cash",name:"現金",type:"cash"};
const acc=id=>id==="cash"?CASH:state.accounts.find(a=>a.id===id);
const banks=()=>state.accounts.filter(a=>a.type==="bank");
const secs=()=>state.accounts.filter(a=>a.type==="sec");
const cards=()=>state.accounts.filter(a=>a.type==="card");
const stepOf=it=>it.cycle==="yearly"?12:it.cycle==="months"?Math.max(1,+it.every||1):1;
function occ(it,start,end){
  const a=parse(it.date);if(!a)return[];
  const step=stepOf(it),stop=parse(it.endDate),out=[];
  const diff=(start.getFullYear()-a.getFullYear())*12+(start.getMonth()-a.getMonth());
  let k=Math.max(0,Math.floor(diff/step)*step-step);
  for(let i=0;i<400;i++,k+=step){const d=addMonths(a,k);if(d>end||(stop&&d>stop))break;if(d>=start)out.push(d)}
  return out;
}
const nextDate=it=>{const t=today(),o=occ(it,t,new Date(t.getFullYear()+6,t.getMonth(),1));return o[0]||null};
const adjustDayOf=c=>+c.adjustDay||((x=>x?x.getDate():0)(parse(c.adjustEnd||c.splitEnd)));
function cardDate(c,y,m){const day=+c.day;if(!day)return null;const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))}
function nextWithdraw(c){const t=today();let d=cardDate(c,t.getFullYear(),t.getMonth());if(!d||d<t)d=cardDate(c,t.getFullYear(),t.getMonth()+1);return d}
function cardCharges(c,y,m){const s=new Date(y,m,1),e=new Date(y,m+1,0);return state.items.filter(it=>it.payFrom===c.id).reduce((a,it)=>a+occ(it,s,e).length*(+it.amount||0),0)}
function cardBill(c,y,m){
  const k=ymKey(y,m),b=state.bills[c.id]&&state.bills[c.id][k];
  if(b!==undefined&&b!==null&&b!=="")return{amount:+b,est:false};
  const p=new Date(y,m-1,1);return{amount:cardCharges(c,p.getFullYear(),p.getMonth()),est:true};
}
function eventsIn(start,end){
  const ev=[];
  state.items.forEach(it=>{const a=acc(it.payFrom);occ(it,start,end).forEach(d=>{
    if(a&&a.type==="card")ev.push({d,type:"charge",name:it.name,amt:+it.amount||0,via:a.name});
    else ev.push({d,type:"withdraw",name:it.name,amt:+it.amount||0,bank:a?a.id:"",via:a?a.name:"支払い方法が未設定"});
  })});
  cards().forEach(c=>{
    let y=start.getFullYear(),m=start.getMonth();
    while(new Date(y,m,1)<=end){
      const d=cardDate(c,y,m);
      if(d&&d>=start&&d<=end){const b=cardBill(c,y,m);if(b.amount>0||!b.est){const bk=acc(c.bankId);ev.push({d,type:"withdraw",card:true,est:b.est,name:c.name+" の引き落とし",amt:b.amount,bank:bk?bk.id:"",via:bk?bk.name:"引き落とし口座が未設定"})}}
      const ad=adjustDayOf(c);if(ad&&!c.archived){const dd=cardDate({day:ad},y,m);if(dd>=start&&dd<=end)ev.push({d:dd,type:"adjust",name:c.name+" の支払額調整",amt:null,via:"支払額調整の期限"})}
      m++;if(m>11){m=0;y++}
    }
  });
  state.wants.forEach(w=>{if(w.bought)return;const d=parse(w.deadline);if(d&&d>=start&&d<=end)ev.push({d,type:"want",name:w.name,amt:+w.price||0,via:"買う期限"})});
  const ord={withdraw:0,charge:1,want:2,adjust:3};
  return ev.sort((a,b)=>(a.d-b.d)||(ord[a.type]-ord[b.type]));
}
function monthsLeft(dl){const t=today();return(dl.getFullYear()-t.getFullYear())*12+(dl.getMonth()-t.getMonth())+1}
function wantMonthly(w,off){
  if(w.bought)return 0;const dl=parse(w.deadline),rem=Math.max(0,(+w.price||0)-(+w.saved||0));
  if(!rem||!dl)return 0;if(dl<today())return off===0?rem:0;
  const ml=monthsLeft(dl);if(ml<off+1)return 0;return Math.ceil(rem/ml);
}
function byBank(ev){
  const g=new Map();
  ev.filter(e=>e.type==="withdraw").forEach(e=>{const k=e.bank||"";if(!g.has(k))g.set(k,{id:k,name:k?acc(k).name:"口座が未設定",total:0,first:e.d,est:false});const x=g.get(k);x.total+=e.amt;if(e.est)x.est=true;if(e.d<x.first)x.first=e.d});
  return[...g.values()].sort((a,b)=>(a.id===""?1:0)-(b.id===""?1:0)||b.total-a.total);
}
function needFor(off){
  const r=monthRange(off),ev=eventsIn(r.start,r.end),groups=byBank(ev);
  const wants=state.wants.reduce((a,w)=>a+wantMonthly(w,off),0);
  return{groups,wants,total:groups.reduce((a,g)=>a+g.total,0)+wants,month:r.start.getMonth()+1};
}
const monthlyEq=it=>(+it.amount||0)/stepOf(it);
function cycleLabel(it){
  const a=parse(it.date);if(!a)return"日付なし";
  if(it.cycle==="yearly")return"毎年"+md(a);
  if(it.cycle==="months")return stepOf(it)+"か月ごと・"+a.getDate()+"日";
  return"毎月"+a.getDate()+"日";
}
function setupIssues(){
  const n=state.items.filter(it=>!acc(it.payFrom)).length;
  const c=cards().filter(c=>!c.archived&&(!+c.day||!acc(c.bankId))).length;
  return{n,c};
}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
let tab="today",mtab="home",ptab="day",btab="meal",monthOff=1;
const t0=today();let calY=t0.getFullYear(),calM=t0.getMonth(),sel=toStr(t0);
const chev='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

function renderTabs(){$("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-tab="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join("")}
function issueBanner(){
  const{n,c}=setupIssues();if(!n&&!c)return"";
  const parts=[];if(n)parts.push(`支払い方法が未設定 ${n}件`);if(c)parts.push(`引き落とし日か口座が未設定のカード ${c}枚`);
  return`<div class="banner"><span>${parts.join("、")}</span><button data-go="${n?"pay":"acct"}">設定する</button></div>`;
}
const hasBal=b=>b&&b.type!=="card"&&b.balance!==undefined&&b.balance!==null&&b.balance!=="";
function balLine(id,until){
  const b=acc(id);if(!until||!hasBal(b))return"";
  const need=eventsIn(today(),until).filter(e=>e.type==="withdraw"&&e.bank===id).reduce((s,e)=>s+e.amt,0),short=need-(+b.balance);
  return`<div class="s bal"><span>残高 ¥${yen(b.balance)}${b.balanceAt?"（"+md(parse(b.balanceAt))+"時点）":""}</span>${short>0?`<span class="tag warn">あと ¥${yen(short)} 入金</span>`:"<span>残高で足りています</span>"}</div>`;
}
function bankRows(groups,until,showFirst=true){
  if(!groups.length)return`<div class="empty">この月の引き落としはありません</div>`;
  return groups.map(g=>`<div class="bk ${g.id?"":"unset"}"><div class="n">${esc(g.name)}</div>${showFirst?`<div class="s">${g.id==="cash"?"最初の支払い":"最初の引き落とし"} ${md(g.first)}（${WD[g.first.getDay()]}）${g.est?"・見込みを含む":""}</div>`:""}${balLine(g.id,until)}<div class="a num">¥${yen(g.total)}</div></div>`).join("");
}
function evRow(e,showLeft){
  const dl=daysBetween(today(),e.d);
  const label=e.type==="withdraw"?(e.bank==="cash"?"現金で支払い":(e.card?"カード引き落とし":"引き落とし")+"・"+esc(e.via)):e.type==="charge"?"カード利用・"+esc(e.via)+"（カード側でまとめて引き落とし）":e.type==="adjust"?"支払額調整の期限":e.type==="save"?esc(e.via):"買う期限";
  const right=showLeft?(dl===0?"今日":"あと"+dl+"日"):(e.est?"見込み":"");
  return`<div class="ev ${e.type}"><div class="date"><span class="d">${md(e.d)}</span><span class="w">${WD[e.d.getDay()]}</span></div><div class="t"><div><span class="mk ${e.type}"></span>${esc(e.name)}</div><div>${label}</div></div><div class="r"><div class="num">${e.amt==null?"":"¥"+yen(e.amt)}</div><div class="${showLeft&&dl<=3?"soon":""}">${right}</div></div></div>`;
}

function scheduleSection(off,n){
  const r=monthRange(off),t=today(),g=new Map();
  eventsIn(r.start,r.end).filter(e=>e.type==="withdraw"&&e.bank!=="cash"&&!(e.card&&e.est)).forEach(e=>{const k=toStr(e.d)+"|"+(e.bank||"");if(!g.has(k))g.set(k,{d:e.d,bank:e.bank||"",amt:0,names:[]});const x=g.get(k);x.amt+=e.amt;x.names.push(e.card?e.name.replace(" の引き落とし",""):e.name)});
  const row=(d,name,sub,amt,right,past)=>`<div class="ev ${past?"past":""}"><div class="date"><span class="d">${md(d)}</span><span class="w">${WD[d.getDay()]}</span></div><div class="t"><div>${esc(name)}</div><div>${esc(sub)}</div></div><div class="r"><div class="num">${amt==null?"金額未定":"¥"+yen(amt)}</div><div>${right}</div></div></div>`;
  const vals=[...g.values()];
  cards().filter(c=>!c.archived&&+c.day).forEach(c=>{const y=r.start.getFullYear(),m=r.start.getMonth(),d=cardDate(c,y,m),b=cardBill(c,y,m);if(d&&b.est){const bk=acc(c.bankId);vals.push({d,bank:bk?bk.id:"",amt:null,names:[c.name]})}});
  let h=vals.sort((a,b)=>a.d-b.d).map(x=>row(x.d,x.bank?acc(x.bank).name:"口座が未設定",x.names.join("、"),x.amt,x.d<t?"済":"",x.d<t)).join("");
  return`<section class="sec"><h2>入金スケジュール</h2>${h||'<div class="empty">この月の入金予定はありません</div>'}</section>`;
}
function cardSection(){
  const cs=cards().filter(c=>!c.archived);if(!cs.length)return"";const t=today();
  const rows=cs.map(c=>{
    const nd=+c.day?nextWithdraw(c):null,v=nd?state.bills[c.id]?.[ymKey(nd.getFullYear(),nd.getMonth())]:undefined,has=v!==undefined&&v!==null&&v!=="";
    const ad=adjustDayOf(c);let adj=null;if(ad){adj=cardDate({day:ad},t.getFullYear(),t.getMonth());if(adj<t)adj=cardDate({day:ad},t.getFullYear(),t.getMonth()+1)}
    const sub=adj?`<div class="s">支払額調整 ${md(adj)}まで</div>`:"";
    return`<button class="bk" data-act="bills"><div class="n">${esc(c.name)}</div>${sub}<div class="a"><div class="num">${has?"¥"+yen(v):'<span class="tag warn">未入力</span>'}</div><div class="s">${nd?`${md(nd)}（${WD[nd.getDay()]}）引き落とし`:"引き落とし日 未設定"}</div></div></button>`}).join("");
  return`<section class="sec"><div class="subhr"><h2>カードの請求額</h2><button data-act="bills">入力</button></div>${rows}</section>`;
}
function homeView(){
  const n=needFor(monthOff),m0=needFor(0).month,m1=needFor(1).month;
  const diff=state.goal-n.total;
  const t=today(),lim=new Date(t);lim.setDate(lim.getDate()+30);
  const up=eventsIn(t,lim).filter(e=>e.type==="withdraw"&&e.bank==="cash");
  [0,1].forEach(o=>{const r=monthRange(o),amt=state.wants.reduce((a,w)=>a+wantMonthly(w,o),0);if(amt&&r.end>=t&&r.end<=lim)up.push({d:r.end,type:"save",name:"欲しい物の積立",amt,via:"期限から逆算した"+(r.end.getMonth()+1)+"月分"})});
  up.sort((a,b)=>a.d-b.d);
  return issueBanner()+`
  <div class="seg" role="group" aria-label="対象の月"><button data-month="0" aria-pressed="${monthOff===0}">今月（${m0}月）</button><button data-month="1" aria-pressed="${monthOff===1}">来月（${m1}月）</button></div>

const TITLES={pay:"支払い",acct:"口座・カード",wants:"欲しい物",goal:"月の稼ぐ目標",bills:"カードの請求額",export:"データを書き出す",import:"データを読み込む",settings:"設定",data:"データの引っ越し"};

function showErr(id,msg){const e=$("e-"+id);if(e){e.textContent=msg;e.hidden=false}}
function save(){
  const k=editing.kind;document.querySelectorAll(".err").forEach(e=>e.hidden=true);let ok=true;
  if(LIFE.has(k)){lifeSaveSheet();return}

    const mo=o&&o.money?o.money:o;

    confirmDlg("データを置き換えますか","今入っているデータは消えて、貼り付けたデータに変わります。","置き換える",()=>{state=normalize(mo);state.migratedV1=true;if(o.life){life=lifeNorm(o.life);lsave()}persist();closeSheet();toast("読み込みました")});return}
  if(k==="bills"){cards().filter(c=>!c.archived&&+c.day).forEach(c=>{const nd=nextWithdraw(c),key=ymKey(nd.getFullYear(),nd.getMonth()),v=val("bill_"+c.id).replace(/[^\d]/g,"");state.bills[c.id]=state.bills[c.id]||{};if(v)state.bills[c.id][key]=parseInt(v,10);else delete state.bills[c.id][key]});done();return}
  const name=val("name");if(!name){showErr("name","名前を入れてください");ok=false}
  const item={...draft,name};

  }
  if(k==="acct"){
    if(item.type==="card"){item.day=digits("day");item.adjustDay=digits("adjustDay");delete item.adjustEnd;delete item.splitEnd;if(item.adjustDay>31){showErr("adjustDay","1〜31で入れてください");ok=false}if(item.day&&(item.day<1||item.day>31)){showErr("day","1〜31で入れてください");ok=false}}
    else{delete item.day;delete item.bankId;const bv=val("balance").replace(/[^\d]/g,""),nb=bv===""?null:parseInt(bv,10);item.balance=nb;item.balanceAt=nb===null?"":(val("balanceAt")||toStr(today()))}
  }

  if(!ok)return;

  if(editing.id){const i=state[list].findIndex(x=>x.id===editing.id);if(i>=0)state[list][i]=item}else state[list].push(item);

/* ---------- life: data ---------- */
const LIFEKEY="life-plan-v1";

const lifeEmpty=()=>({v:1,projects:[],todos:[],templates:[],events:[],days:{},foods:[],meals:{},weights:{},exPlans:[],exLogs:{},profile:{}});
function lifeNorm(o){const e=lifeEmpty();if(!o||typeof o!=="object")return e;o=JSON.parse(JSON.stringify(o));Object.keys(e).forEach(k=>{if(o[k]!==undefined&&o[k]!==null&&Array.isArray(o[k])===Array.isArray(e[k])&&typeof o[k]===typeof e[k])e[k]=o[k]});return e}
let life=lifeEmpty();
try{const r=localStorage.getItem(LIFEKEY);if(r)life=lifeNorm(JSON.parse(r))}catch(e){}

const DS=7*60,DE=24*60,SC=1.4;
const hm=m=>Math.floor(m/60)+":"+pad(m%60);
const toMin=s=>{if(!s)return null;const p=s.split(":").map(Number);return isNaN(p[0])?null:p[0]*60+(p[1]||0)};
const minStr=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const durLabel=m=>m<=0?"0分":(m>=60?Math.floor(m/60)+"時間":"")+(m%60?(m%60)+"分":"");
const proj=id=>life.projects.find(p=>p.id===id);
const DOWS=[1,2,3,4,5,6,0];
const dowsLabel=a=>a&&a.length===7?"毎日":DOWS.filter(d=>(a||[]).includes(d)).map(d=>WD[d]).join("・");
let planDate=today(),bodyDate=today(),tplDow=today().getDay(),tproj="",justDragged=false,drag=null;

/* ---------- life: todo ---------- */
const usesTime=t=>t.time==="once"||t.time==="multi"||t.time==="cont";
const isRepeat=t=>t.repeat==="weekly"||t.repeat==="daily";
const occursOn=(t,d)=>t.repeat==="daily"||(t.repeat==="weekly"&&(t.dows||[]).includes(d.getDay()));
const isDoneOn=(t,key)=>isRepeat(t)?!!(t.doneDates&&t.doneDates[key]):!!t.done;
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function contWeekMin(t){const s=weekStart(today());let m=0;for(let i=0;i<7;i++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),day=life.days[toStr(d)];if(day)day.blocks.forEach(b=>{if(b.todoId===t.id&&b.done)m+=b.end-b.start})}return m}
function todoSub(t){
  const parts=[];
  if(t.time==="multi")parts.push(`${+((t.doneMin||0)/60).toFixed(1)} / ${+((t.totalMin||0)/60).toFixed(1)}時間`);
  if(t.time==="once")parts.push(durLabel(t.minutes||30));
  if(t.time==="cont")parts.push(`続ける・今週 ${durLabel(contWeekMin(t))}`);
  if(t.repeat==="daily")parts.push("毎日");
  if(t.repeat==="weekly")parts.push("毎週 "+dowsLabel(t.dows));
  if(!isRepeat(t)&&t.due){const d=parse(t.due);if(d)parts.push(md(d)+"まで")}
  return parts.join("・");
}
const dueSoon=t=>!isRepeat(t)&&!t.done&&t.due&&daysBetween(today(),parse(t.due))<=1;
function todayTodos(){const t=today(),k=toStr(t);return life.todos.filter(x=>{if(isRepeat(x))return occursOn(x,t)&&x.time==="check";if(x.done||x.time!=="check")return false;return !!x.due&&x.due<=k})}
function toggleTodo(id){const t=life.todos.find(x=>x.id===id);if(!t)return;const k=toStr(today());if(isRepeat(t)){t.doneDates=t.doneDates||{};if(t.doneDates[k])delete t.doneDates[k];else t.doneDates[k]=true}else t.done=!t.done;lsave();renderMainOnly()}
function pickable(key){const d=parse(key);return life.todos.filter(t=>usesTime(t)&&(isRepeat(t)?occursOn(t,d)&&!isDoneOn(t,key):!t.done)).sort((a,b)=>(a.time==="cont")-(b.time==="cont")||((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0))}
function remainOf(t){if(t.time==="multi")return Math.max(0,(t.totalMin||0)-(t.doneMin||0));if(t.time==="once")return t.minutes||30;return null}

/* ---------- life: day ---------- */
function ensureDay(key){if(!life.days[key])life.days[key]={built:false,blocks:[],picked:[]};return life.days[key]}
function allBlocks(key){const d=life.days[key],b=(d?d.blocks:[]).map(x=>({...x}));life.events.filter(e=>e.date===key).forEach(e=>b.push({id:e.id,kind:"event",name:e.name,start:e.start,end:e.end}));return b.sort((a,c)=>a.start-c.start||a.end-c.end)}
function gapsOf(bl){const out=[];let cur=DS;bl.forEach(b=>{if(b.start-cur>=15)out.push({start:cur,end:Math.min(b.start,DE)});cur=Math.max(cur,b.end)});if(DE-cur>=15)out.push({start:cur,end:DE});return out}
const tplsFor=dow=>life.templates.filter(t=>(t.dows||[]).includes(dow)).sort((a,b)=>a.start-b.start);
function applyProgress(key,b,sign){const t=life.todos.find(x=>x.id===b.todoId);if(!t)return;const m=b.end-b.start;if(t.time==="multi")t.doneMin=Math.max(0,(t.doneMin||0)+sign*m);if(t.time==="once"&&!isRepeat(t))t.done=sign>0;if(isRepeat(t)){t.doneDates=t.doneDates||{};if(sign>0)t.doneDates[key]=true;else delete t.doneDates[key]}}
function setBlockDone(key,id){const d=life.days[key];const b=d&&d.blocks.find(x=>x.id===id);if(!b)return;b.done=!b.done;applyProgress(key,b,b.done?1:-1);lsave();renderMainOnly()}
function resizeBlock(key,id,ne){
  const d=life.days[key];if(!d)return;const b=d.blocks.find(x=>x.id===id);if(!b)return;
  const old=b.end;b.end=ne;if(b.done&&b.todoId){const t=life.todos.find(x=>x.id===b.todoId);if(t&&t.time==="multi")t.doneMin=Math.max(0,(t.doneMin||0)+(ne-old))}
  if(ne>old){let cur=ne;d.blocks.filter(x=>x.id!==id&&x.start>=b.start).sort((a,c)=>a.start-c.start).forEach(x=>{if(x.start<cur){const sh=cur-x.start;x.start+=sh;x.end=Math.min(DE,x.end+sh);cur=x.end}})}
  lsave();renderMainOnly();
}
function toggleEx(planId,key){const p=life.exPlans.find(x=>x.id===planId);if(!p)return;const L=life.exLogs[key]||(life.exLogs[key]=[]);const i=L.findIndex(x=>x.planId===planId);if(i>=0)L.splice(i,1);else L.push({id:uid(),planId,name:p.name,minutes:p.minutes,level:p.level});lsave();renderMainOnly()}

/* ---------- life: body ---------- */
const targetW=()=>+(life.profile||{}).targetW||null;
const toGoal=w=>{const t=targetW();if(!t||!w)return"";const d=+(t-w).toFixed(1);return d===0?"目標に到達":`目標 ${t}kg まで ${d>0?"+":"−"}${Math.abs(d).toFixed(1)}kg`};
const latestWeight=()=>{const ks=Object.keys(life.weights).sort();return ks.length?+life.weights[ks[ks.length-1]]:null};
function targetKcal(){return kcalFrom(life.profile||{},latestWeight())}
function kcalFrom(p,w){if(+p.manualKcal)return +p.manualKcal;if(!(+p.age&&+p.height&&w))return null;const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="female"?-161:5);const f={low:1.375,mid:1.55,high:1.725}[p.activity||"mid"];const g={lose:-400,keep:0,gain:300}[p.goal||"keep"];return Math.round((bmr*f+g)/10)*10}
const METS={light:3,mid:5,hard:8};
const exKcal=x=>Math.round((METS[x.level]||5)*(latestWeight()||60)*(+x.minutes||0)/60*1.05);
const eatenOn=k=>(life.meals[k]||[]).reduce((a,m)=>a+(+m.kcal||0),0);
const burnedOn=k=>(life.exLogs[k]||[]).reduce((a,x)=>a+exKcal(x),0);
const MEALS=[["b","朝"],["l","昼"],["d","夜"],["s","間食"]];

    day.blocks=day.blocks.filter(b=>b.kind!=="tpl").concat(life.templates.filter(t=>d.picked.includes(t.id)).map(t=>keep[t.id]||{id:uid(),kind:"tpl",tplId:t.id,name:t.name,start:t.start,end:t.end}));
    day.built=true;day.picked=d.picked.slice();planDate=parse(d.key);tab="plan";ptab="day"}
  if(k==="pick"){const t=life.todos.find(x=>x.id===d.todoId);if(!t){showErr("len","やることを選んでください");return}const len=+d.len||30;ensureDay(d.key).blocks.push({id:uid(),kind:"todo",todoId:t.id,name:t.name,start:d.start,end:Math.min(d.end,d.start+len)})}
  if(k==="block"){const tp=timePair();if(!tp)return;const day=life.days[d.key],b=day.blocks.find(x=>x.id===id);const wasDone=!!b.done,len0=b.end-b.start;
    if(wasDone)applyProgress(d.key,b,-1);b.start=tp[0];b.end=tp[1];b.done=!!d.done;if(b.done)applyProgress(d.key,b,1)}
  if(k==="meal"){const name=val("name");if(!name){showErr("name","食べた物を入れてください");return}const kcal=digits("kcal");
    const L=life.meals[d.key]||(life.meals[d.key]=[]);const e={id:id||uid(),meal:d.meal,name,kcal};if(id)L[L.findIndex(x=>x.id===id)]=e;else L.push(e);
    const fi=life.foods.findIndex(f=>f.name===name);if(d.fav&&fi<0)life.foods.push({name,kcal});else if(d.fav&&fi>=0)life.foods[fi].kcal=kcal;else if(!d.fav&&fi>=0)life.foods.splice(fi,1)}
  if(k==="weight"){const kg=fval("kg");if(!(kg>0)){showErr("kg","体重を入れてください");return}const date=val("date");if(!parse(date)){showErr("date","日付を選んでください");return}if(id&&id!==date)delete life.weights[id];life.weights[date]=+kg.toFixed(1)}
  if(k==="ex"){const name=val("name");if(!name){showErr("name","運動を入れてください");return}const minutes=digits("minutes")||30;
    if(d.mode==="plan"){if(!(d.dows||[]).length){showErr("dows","曜日を選んでください");return}const p={id:id||uid(),name,minutes,level:d.level||"mid",dows:d.dows};if(id)life.exPlans[life.exPlans.findIndex(x=>x.id===id)]=p;else life.exPlans.push(p)}
    else{const date=val("date");if(!parse(date)){showErr("date","日付を選んでください");return}if(id&&d.key){const L0=life.exLogs[d.key]||[];const i=L0.findIndex(x=>x.id===id);if(i>=0)L0.splice(i,1)}(life.exLogs[date]||(life.exLogs[date]=[])).push({id:id||uid(),name,minutes,level:d.level||"mid"})}}
  if(k==="profile"){life.profile={sex:d.sex,activity:d.activity,goal:d.goal,age:digits("age"),height:digits("height"),manualKcal:digits("manualKcal"),targetW:fval("tw")?+fval("tw").toFixed(1):0};const pw=fval("pw");if(pw>0&&pw!==latestWeight())life.weights[toStr(today())]=+pw.toFixed(1)}
  lsave();closeSheet();toast("保存しました");
}
function lifeDelete(){
  const k=editing.kind,d=draft,id=editing.id;
  if(k==="todo"){life.todos=life.todos.filter(x=>x.id!==id)}
  if(k==="tpl")life.templates=life.templates.filter(x=>x.id!==id);
  if(k==="event")life.events=life.events.filter(x=>x.id!==id);
  if(k==="block"){const day=life.days[d.key];const b=day.blocks.find(x=>x.id===id);if(b&&b.done)applyProgress(d.key,b,-1);day.blocks=day.blocks.filter(x=>x.id!==id);if(b&&b.kind==="tpl")day.picked=(day.picked||[]).filter(p=>p!==b.tplId)}
  if(k==="meal")life.meals[d.key]=(life.meals[d.key]||[]).filter(x=>x.id!==id);
  if(k==="weight")delete life.weights[id];
  if(k==="ex"){if(d.mode==="plan")life.exPlans=life.exPlans.filter(x=>x.id!==id);else life.exLogs[d.key]=(life.exLogs[d.key]||[]).filter(x=>x.id!==id)}
  lsave();closeSheet();toast(k==="block"?"外しました":"削除しました");
}

/* ---------- life: events ---------- */
function lifeClick(e){
  const s=e.target.closest("[data-sub]");if(s){const v=s.dataset.v;if(s.dataset.sub==="m")mtab=v;else if(s.dataset.sub==="p")ptab=v;else btab=v;reorder=false;render();$("main").scrollTop=0;return true}
  const el=e.target.closest("[data-la]");if(!el)return false;const a=el.dataset.la;
  if(a==="pday"){planDate=new Date(planDate.getFullYear(),planDate.getMonth(),planDate.getDate()+(+el.dataset.d));renderMainOnly()}
  else if(a==="ptoday"){planDate=today();renderMainOnly()}
  else if(a==="bday"){bodyDate=new Date(bodyDate.getFullYear(),bodyDate.getMonth(),bodyDate.getDate()+(+el.dataset.d));renderMainOnly()}
  else if(a==="btoday"){bodyDate=today();renderMainOnly()}
  else if(a==="build")openSheet("build",null,{key:el.dataset.key});
  else if(a==="gotoplan"){tab="plan";ptab="day";planDate=today();render()}
  else if(a==="gobody"){tab="body";btab="meal";bodyDate=today();render()}
  else if(a==="gomoney"){tab="money";mtab="home";render()}
  else if(a==="gap"){const p=el.dataset.gap.split("-").map(Number);openSheet("pick",null,{key:toStr(planDate),start:p[0],end:p[1]})}
  else if(a==="blk"){if(justDragged)return true;const key=toStr(planDate),b=allBlocks(key).find(x=>x.id===el.dataset.id);if(!b)return true;if(b.kind==="event")openSheet("event",b.id);else openSheet("block",b.id,{key})}
  else if(a==="bdone")setBlockDone(toStr(today()),el.dataset.id);
  else if(a==="tck")toggleTodo(el.dataset.id);
  else if(a==="exck")toggleEx(el.dataset.id,el.dataset.key);
  else if(a==="ledit")openSheet(el.dataset.k,el.dataset.id,{key:el.dataset.key,plan:el.dataset.plan==="1"});
  else if(a==="addmeal")openSheet("meal",null,{key:toStr(bodyDate),meal:el.dataset.meal});
  else if(a==="fav")quickFav(+el.dataset.i);
  else if(a==="tproj"){tproj=el.dataset.v;renderMainOnly()}
  else if(a==="tdow"){tplDow=+el.dataset.d;renderMainOnly()}
  else if(a==="profile")openSheet("profile");
  return true;
}
function fabClick(){
  if(tab==="money")return openSheet(mtab);
  if(tab==="plan")return openSheet(ptab==="day"?"event":"tpl");
  if(tab==="todo")return openSheet("todo");
  if(tab==="body")return openSheet(btab==="meal"?"meal":btab==="weight"?"weight":"ex",null,{key:toStr(bodyDate)});
}
$("main").addEventListener("pointerdown",e=>{const h=e.target.closest("[data-hdl]");if(!h)return;e.preventDefault();e.stopPropagation();const key=toStr(planDate),d=life.days[key],b=d&&d.blocks.find(x=>x.id===h.dataset.hdl);if(!b)return;drag={id:b.id,key,y:e.clientY,start:b.start,end:b.end,el:h.parentElement,ne:null};try{h.setPointerCapture(e.pointerId)}catch(_){}});
$("main").addEventListener("pointermove",e=>{if(!drag)return;e.preventDefault();const dm=Math.round((e.clientY-drag.y)/SC/5)*5,ne=Math.max(drag.start+10,Math.min(DE,drag.end+dm));drag.ne=ne;drag.el.style.height=Math.max(14,(ne-Math.max(drag.start,DS))*SC-2)+"px";const t=drag.el.querySelector(".tm");if(t)t.textContent=hm(drag.start)+"–"+hm(ne)});
function endDrag(){if(!drag)return;const g=drag;drag=null;justDragged=true;setTimeout(()=>justDragged=false,350);if(g.ne!==null&&g.ne!==g.end)resizeBlock(g.key,g.id,g.ne)}
$("main").addEventListener("pointerup",endDrag);$("main").addEventListener("pointercancel",endDrag);
const hclick=e=>{const b=e.target.closest("[data-hact]");if(!b)return;const a=b.dataset.hact;if(a==="macct")mtab="acct";if(a==="mback")mtab="home";if(a==="profile"){openSheet("profile");return}if(a==="settings"){openSheet("settings");return}reorder=false;render()};
$("hact").addEventListener("click",hclick);$("hlact").addEventListener("click",hclick);

/* ---------- events ---------- */
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;reorder=false;if(tab==="plan")planDate=today();if(tab==="body")bodyDate=today();render();$("main").scrollTop=0});
$("main").addEventListener("click",e=>{
  if(lifeClick(e))return;
  const m=e.target.closest("[data-month]");if(m){monthOff=+m.dataset.month;renderMainOnly();return}
  const c=e.target.closest("[data-cal]");if(c){calM+=+c.dataset.cal;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}const t=today();sel=(t.getMonth()===calM&&t.getFullYear()===calY)?toStr(t):toStr(new Date(calY,calM,1));renderMainOnly();return}
  const dy=e.target.closest("[data-day]");if(dy){sel=dy.dataset.day;renderMainOnly();return}
  const g=e.target.closest("[data-go]");if(g){tab="money";mtab=g.dataset.go;render();$("main").scrollTop=0;return}
  const ed=e.target.closest("[data-edit]");if(ed){openSheet(mtab,ed.dataset.edit);return}
  const mv=e.target.closest("[data-mv]");if(mv){if(!mv.disabled)moveAcct(mv.dataset.mv,+mv.dataset.d);return}
  const a=e.target.closest("[data-act]");if(a&&a.dataset.act==="goal")openSheet("goal");
  if(a&&a.dataset.act==="reorder"){reorder=!reorder;render()}
  if(a&&a.dataset.act==="bills")openSheet("bills");
  if(a&&a.dataset.act==="import")openSheet("import");
  if(a&&a.dataset.act==="export"){const txt=JSON.stringify({money:state,life});try{navigator.clipboard.writeText(txt).then(()=>toast("コピーしました"),()=>openSheet("export"))}catch(e){openSheet("export")}}
});
$("fab").addEventListener("click",fabClick);
$("sheetClose").addEventListener("click",closeSheet);
$("sheetSave").addEventListener("click",save);
$("sheetBody").addEventListener("submit",e=>{e.preventDefault();save()});
$("sheetBody").addEventListener("click",e=>{
  const sa=e.target.closest("[data-act]");
  if(sa&&sa.dataset.act==="godata"){openSheet("data");return}
  if(sa&&sa.dataset.act==="import"){openSheet("import");return}
  if(sa&&sa.dataset.act==="export"){const txt=JSON.stringify({money:state,life});try{navigator.clipboard.writeText(txt).then(()=>toast("コピーしました"),()=>openSheet("export"))}catch(_){openSheet("export")}return}
  const s=e.target.closest("[data-sw]");if(s){const k=s.dataset.sw;draft[k]=s.getAttribute("aria-checked")!=="true";s.setAttribute("aria-checked",draft[k]);return}
  const mc=e.target.closest("[data-mchip]");if(mc){const k=mc.dataset.mchip,v=mc.dataset.n?+mc.dataset.v:mc.dataset.v,arr=draft[k]||(draft[k]=[]),i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);mc.setAttribute("aria-pressed",i<0);return}
  const g=e.target.closest("[data-seg]");if(g){draft[g.dataset.seg]=g.dataset.v;if(["type","cycle","repeat","time","mode"].includes(g.dataset.seg)){drawSheet();const ev=$("f-every");if(ev&&g.dataset.v==="months"&&digits("every")<2)ev.value="4"}else g.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===g));updKcal();return}
  const ch=e.target.closest("[data-chip]");if(ch){const k=ch.dataset.chip;draft[k]=draft[k]===ch.dataset.v&&k!=="todoId"&&k!=="len"?"":ch.dataset.v;if(k==="todoId"){draft.len="";drawSheet();return}ch.parentElement.querySelectorAll("[data-chip]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===draft[k]));return}
  const a=e.target.closest("[data-act='del']");
  if(a){
    if(LIFE.has(editing.kind)){confirmDlg(editing.kind==="block"?"この日から外しますか":"削除しますか",editing.kind==="block"?"タイムラインから外します。":`「${esc(draft.name||"")}」を消します。元に戻せません。`,editing.kind==="block"?"外す":"削除",lifeDelete);return}
    const k=editing.kind,id=editing.id,list=k==="pay"?"items":k==="acct"?"accounts":"wants";
    const extra=k==="acct"?"この口座・カードを使っている支払いは「未設定」に戻ります。":"";
    confirmDlg("削除しますか",`「${esc(draft.name)}」を消します。${extra}元に戻せません。`,"削除",()=>{
      state[list]=state[list].filter(x=>x.id!==id);
      if(k==="acct"){state.items.forEach(it=>{if(it.payFrom===id)it.payFrom=""});state.accounts.forEach(c=>{if(c.bankId===id)c.bankId=""});delete state.bills[id]}
      persist();closeSheet();toast("削除しました");
    });
  }
});
$("sheetBody").addEventListener("input",e=>{
  const i=e.target;if(i.dataset.num){const raw=i.value.replace(/[^\d]/g,"");i.value=raw?parseInt(raw,10).toLocaleString("ja-JP"):""}
  updWantCalc();updKcal();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("layer").innerHTML)$("layer").innerHTML="";else if(sheetOpen)closeSheet()}});

render();
connect();
